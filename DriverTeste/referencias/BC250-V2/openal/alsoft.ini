# AMD BC-250 APU (Cyan Skillfish) - OpenAL Soft Configuration
# Localização: %APPDATA%\alsoft.ini ou %ProgramData%\alsoft.ini

[general]
# Define a prioridade dos drivers de áudio.
# O fallback para 'null' garante que aplicações OpenAL (Minecraft Java Edition,
# emuladores RPCS3/Ryujinx, jogos 3D) inicializem sem erro mesmo quando a placa
# estiver operando sem caixas de som físicas (resolvendo o erro MMDevApi 0x80070490).
# Se um fone USB ou cabo virtual for instalado, o áudio funcionará normalmente.
drivers = -wasapi,null

# Taxa de amostragem padrão (48000 Hz padrão de alta fidelidade)
frequency = 48000

# Formato e canais (Stereo ou 5.1 / 7.1)
channels = stereo

# Habilitar HRTF (Áudio 3D espacial para fones de ouvido)
# Valores: auto, true, false
hrtf = auto

# Período de buffer para latência ultra-baixa em jogos
period_size = 512
periods = 3

# Modo de resampling de alta qualidade
resampler = sinc4
